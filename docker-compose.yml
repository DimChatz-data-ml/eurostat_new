services:
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: eurostat-postgres
    env_file:
      - .env
    ports:
      - "5433:5432"

  pgadmin:
    image: dpage/pgadmin4
    container_name: eurostat-pgadmin
    env_file:
      - .env
    ports:
      - "8080:80"
    depends_on:
      - postgres